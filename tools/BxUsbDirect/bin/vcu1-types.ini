#   type=6  Relay parses header then branches on type==6 (special path)
#   version must be 1; payload length BE; max 0x400000
#
# Until full enum is recovered from 01.dylib handleType, media payloads default to 3.
# Override here after capture/对照参照.

video_config_type=3
audio_config_type=3
video_type=3
audio_type=3
default_flags=0
