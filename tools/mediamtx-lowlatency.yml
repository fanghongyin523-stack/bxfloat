logLevel: info

authMethod: internal

authInternalUsers:
  - user: any
    pass:
    permissions:
      - action: publish
      - action: read
      - action: playback

rtmp: true
rtmpAddress: :11935

rtsp: true
rtspAddress: :18554

hls: true
hlsAddress: :18888
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsSegmentMaxSize: 50M
hlsAllowOrigins: ["*"]

srt: true
srtAddress: :18890

paths:
  all_others:
