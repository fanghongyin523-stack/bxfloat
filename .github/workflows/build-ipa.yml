name: Build IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "BXFloatMVP/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup CocoaPods
        run: |
          gem install cocoapods -N
          pod install --repo-update

      - name: Build App + Inject (with VLC) + Host
        run: |
          set -euo pipefail
          # MVP + Inject 走 workspace（含 MobileVLCKit）
          for scheme in BXFloatMVP BXFloatInject; do
            xcodebuild \
              -workspace BXFloatMVP.xcworkspace \
              -scheme "$scheme" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
          done

          # Host 仍用工程（无 VLC）
          xcodebuild \
            -project BXFloatMVP.xcodeproj \
            -scheme BXFloatHost \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Install ldid
        run: brew install ldid

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p ../dist

          sign_tree () {
            local root="$1"
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q 'Mach-O'; then
                ldid -S "$f" || true
              fi
            done < <(find "$root" -type f -print0)
          }

          package_ipa () {
            local app_path="$1"
            local out_ipa="$2"
            test -d "$app_path"
            sign_tree "$app_path"
            rm -rf Payload
            mkdir Payload
            cp -R "$app_path" Payload/
            zip -qr "$out_ipa" Payload
            cp "$out_ipa" ../dist/
          }

          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatMVP.app" \
            "BXFloatMVP.ipa"

          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatHost.app" \
            "BXFloatHost.ipa"

          DYLIB="build/Build/Products/Release-iphoneos/BXFloatInject.dylib"
          test -f "$DYLIB"
          ldid -S "$DYLIB" || true
          install_name_tool -add_rpath "@executable_path/Frameworks" "$DYLIB" 2>/dev/null || true
          install_name_tool -add_rpath "@loader_path/Frameworks" "$DYLIB" 2>/dev/null || true

          # 注入包：dylib + MobileVLCKit.framework（局域网 RTSP 需要）
          rm -rf ../dist/BXFloatInjectPack
          mkdir -p ../dist/BXFloatInjectPack/Frameworks
          cp "$DYLIB" ../dist/BXFloatInjectPack/BXFloatInject.dylib
          cp "$DYLIB" ../dist/BXFloatInject.dylib

          FW=$(find build Pods -type d -name 'MobileVLCKit.framework' 2>/dev/null | head -n 1 || true)
          if [ -z "$FW" ] || [ ! -d "$FW" ]; then
            echo "MobileVLCKit.framework not found"
            find build -iname '*VLC*' | head -n 80 || true
            exit 1
          fi
          echo "Using VLC framework: $FW"

          cp -R "$FW" ../dist/BXFloatInjectPack/Frameworks/
          sign_tree ../dist/BXFloatInjectPack

          cat > ../dist/BXFloatInjectPack/安装说明.txt << 'EOF'
BXFloat 注入包（局域网 RTSP 低延迟）

文件：
1) BXFloatInject.dylib
2) Frameworks/MobileVLCKit.framework

安装步骤（抖音等）：
A. 用 TrollFools 注入 BXFloatInject.dylib
B. 用 Filza 打开目标 App 包内，把 MobileVLCKit.framework
   复制到：XXX.app/Frameworks/
   （没有 Frameworks 文件夹就新建一个）
C. 杀进程后重新打开 App，悬浮窗选「局域网」填电脑 IP

说明：
- 本 App（BXFloatMVP.ipa）不需要 Framework，已内置 VLC
- 注入版必须带上 MobileVLCKit，否则无法 RTSP，会退回/失败
EOF

          (
            cd ../dist/BXFloatInjectPack
            zip -qr ../BXFloatInjectPack.zip .
          )
          ls -lh ../dist

      - name: Upload MVP IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatMVP-ipa
          path: dist/BXFloatMVP.ipa

      - name: Upload Host IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatHost-ipa
          path: dist/BXFloatHost.ipa

      - name: Upload Inject dylib
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatInject-dylib
          path: dist/BXFloatInject.dylib

      - name: Upload Inject Pack (dylib + VLC)
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatInjectPack
          path: dist/BXFloatInjectPack.zip
