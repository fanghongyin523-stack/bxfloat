name: Build IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "BXFloatMVP/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (no Apple Developer cert)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BXFloatMVP.xcodeproj \
            -scheme BXFloatMVP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Install ldid
        run: brew install ldid

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/BXFloatMVP.app"
          test -d "$APP"
          ldid -S"Resources/TrollStore.entitlements" "$APP/BXFloatMVP"
          rm -rf Payload BXFloatMVP.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr BXFloatMVP.ipa Payload
          ls -lh BXFloatMVP.ipa
          mkdir -p ../dist
          cp BXFloatMVP.ipa ../dist/BXFloatMVP.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatMVP-ipa
          path: dist/BXFloatMVP.ipa
          if-no-files-found: error
