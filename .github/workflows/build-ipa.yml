name: Build IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "BXFloatMVP/**"
      - "tools/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  # 单机构建：三机矩阵会挤爆排队、15 分钟未开跑就被取消。
  inject:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fetch FFmpeg static libs (embed into single dylib)
        working-directory: .
        run: |
          set -euo pipefail
          chmod +x tools/ci-fetch-ffmpeg-ios.sh
          tools/ci-fetch-ffmpeg-ios.sh
          ls -lh BXFloatMVP/Vendor/FFmpeg/lib
          test -f BXFloatMVP/Vendor/FFmpeg/include/libavformat/avformat.h \
            || find BXFloatMVP/Vendor/FFmpeg/include -name 'avformat.h' | head -n 1 | grep -q .

      - name: Build Inject dylib
        run: |
          set -euo pipefail
          xcodebuild \
            -project BXFloatMVP.xcodeproj \
            -scheme BXFloatInject \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package dylib
        run: |
          set -euo pipefail
          mkdir -p ../dist
          DYLIB="build/Build/Products/Release-iphoneos/BXFloatInject.dylib"
          test -f "$DYLIB"
          if ! command -v ldid >/dev/null 2>&1; then brew install ldid; fi
          ldid -S "$DYLIB" || true
          cp "$DYLIB" ../dist/BXFloatInject.dylib
          ls -lh ../dist/BXFloatInject.dylib
          file ../dist/BXFloatInject.dylib
          # 参考版约 9MB；内嵌 FFmpeg 后应明显大于旧的 ~0.5MB
          python3 - <<'PY'
          import os
          p="../dist/BXFloatInject.dylib"
          n=os.path.getsize(p)
          print(f"size_bytes={n}")
          if n < 2_000_000:
              raise SystemExit(f"dylib too small ({n}); FFmpeg likely not linked")
          PY

      - name: Upload Inject dylib
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatInject-dylib-${{ matrix.os }}
          path: dist/BXFloatInject.dylib
          if-no-files-found: error

  app:
    if: github.event_name == 'workflow_dispatch'
    needs: []
    runs-on: macos-14
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup CocoaPods
        run: |
          gem install cocoapods -N
          pod install --repo-update

      - name: Build App + Host
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace BXFloatMVP.xcworkspace \
            -scheme BXFloatMVP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build
          xcodebuild \
            -project BXFloatMVP.xcodeproj \
            -scheme BXFloatHost \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPAs
        run: |
          set -euo pipefail
          mkdir -p ../dist
          if ! command -v ldid >/dev/null 2>&1; then brew install ldid; fi
          sign_tree () {
            local root="$1"
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q 'Mach-O'; then
                ldid -S "$f" || true
              fi
            done < <(find "$root" -type f -print0)
          }
          package_ipa () {
            local app_path="$1"
            local out_ipa="$2"
            test -d "$app_path"
            sign_tree "$app_path"
            rm -rf Payload
            mkdir Payload
            cp -R "$app_path" Payload/
            zip -qr "$out_ipa" Payload
            cp "$out_ipa" ../dist/
          }
          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatMVP.app" \
            "BXFloatMVP.ipa"
          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatHost.app" \
            "BXFloatHost.ipa"
          ls -lh ../dist

      - name: Upload MVP IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatMVP-ipa
          path: dist/BXFloatMVP.ipa

      - name: Upload Host IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatHost-ipa
          path: dist/BXFloatHost.ipa

