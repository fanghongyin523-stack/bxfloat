name: Build IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "BXFloatMVP/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build App + Host + Inject
        run: |
          set -euo pipefail
          for scheme in BXFloatMVP BXFloatHost BXFloatInject; do
            xcodebuild \
              -project BXFloatMVP.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
          done

      - name: Install ldid
        run: brew install ldid

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p ../dist

          package_ipa () {
            local app_path="$1"
            local exe_name="$2"
            local out_ipa="$3"
            test -d "$app_path"
            ldid -S"Resources/TrollStore.entitlements" "$app_path/$exe_name"
            rm -rf Payload
            mkdir Payload
            cp -R "$app_path" Payload/
            zip -qr "$out_ipa" Payload
            cp "$out_ipa" ../dist/
          }

          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatMVP.app" \
            "BXFloatMVP" \
            "BXFloatMVP.ipa"

          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatHost.app" \
            "BXFloatHost" \
            "BXFloatHost.ipa"

          DYLIB="build/Build/Products/Release-iphoneos/BXFloatInject.dylib"
          test -f "$DYLIB"
          ldid -S "$DYLIB"
          cp "$DYLIB" ../dist/BXFloatInject.dylib
          ls -lh ../dist

      - name: Upload MVP IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatMVP-ipa
          path: dist/BXFloatMVP.ipa

      - name: Upload Host IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatHost-ipa
          path: dist/BXFloatHost.ipa

      - name: Upload Inject dylib
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatInject-dylib
          path: dist/BXFloatInject.dylib
