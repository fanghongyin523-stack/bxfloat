name: Build IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "BXFloatMVP/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  inject:
    runs-on: macos-13
    timeout-minutes: 45
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Inject dylib
        run: |
          set -euo pipefail
          xcodebuild \
            -project BXFloatMVP.xcodeproj \
            -scheme BXFloatInject \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package dylib
        run: |
          set -euo pipefail
          mkdir -p ../dist
          DYLIB="build/Build/Products/Release-iphoneos/BXFloatInject.dylib"
          test -f "$DYLIB"
          if command -v ldid >/dev/null 2>&1; then
            ldid -S "$DYLIB" || true
          else
            brew install ldid
            ldid -S "$DYLIB" || true
          fi
          cp "$DYLIB" ../dist/BXFloatInject.dylib
          ls -lh ../dist/BXFloatInject.dylib

      - name: Upload Inject dylib
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatInject-dylib
          path: dist/BXFloatInject.dylib

  app:
    runs-on: macos-13
    timeout-minutes: 60
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup CocoaPods
        run: |
          gem install cocoapods -N
          pod install --repo-update

      - name: Build App + Host
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace BXFloatMVP.xcworkspace \
            -scheme BXFloatMVP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build
          xcodebuild \
            -project BXFloatMVP.xcodeproj \
            -scheme BXFloatHost \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPAs
        run: |
          set -euo pipefail
          mkdir -p ../dist
          if ! command -v ldid >/dev/null 2>&1; then brew install ldid; fi
          sign_tree () {
            local root="$1"
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q 'Mach-O'; then
                ldid -S "$f" || true
              fi
            done < <(find "$root" -type f -print0)
          }
          package_ipa () {
            local app_path="$1"
            local out_ipa="$2"
            test -d "$app_path"
            sign_tree "$app_path"
            rm -rf Payload
            mkdir Payload
            cp -R "$app_path" Payload/
            zip -qr "$out_ipa" Payload
            cp "$out_ipa" ../dist/
          }
          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatMVP.app" \
            "BXFloatMVP.ipa"
          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatHost.app" \
            "BXFloatHost.ipa"
          ls -lh ../dist

      - name: Upload MVP IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatMVP-ipa
          path: dist/BXFloatMVP.ipa

      - name: Upload Host IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatHost-ipa
          path: dist/BXFloatHost.ipa
