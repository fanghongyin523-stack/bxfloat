name: Build IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "BXFloatMVP/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup CocoaPods
        run: |
          gem install cocoapods -N
          pod install --repo-update

      - name: Build App (with VLC) + Host + Inject
        run: |
          set -euo pipefail
          # MVP 走 workspace（含 MobileVLCKit）
          xcodebuild \
            -workspace BXFloatMVP.xcworkspace \
            -scheme BXFloatMVP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

          # Host / Inject 仍用工程（无 VLC，体积小）
          for scheme in BXFloatHost BXFloatInject; do
            xcodebuild \
              -project BXFloatMVP.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
          done

      - name: Install ldid
        run: brew install ldid

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p ../dist

          sign_tree () {
            local root="$1"
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q 'Mach-O'; then
                ldid -S "$f" || true
              fi
            done < <(find "$root" -type f -print0)
          }

          package_ipa () {
            local app_path="$1"
            local out_ipa="$2"
            test -d "$app_path"
            sign_tree "$app_path"
            rm -rf Payload
            mkdir Payload
            cp -R "$app_path" Payload/
            zip -qr "$out_ipa" Payload
            cp "$out_ipa" ../dist/
          }

          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatMVP.app" \
            "BXFloatMVP.ipa"

          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatHost.app" \
            "BXFloatHost.ipa"

          DYLIB="build/Build/Products/Release-iphoneos/BXFloatInject.dylib"
          test -f "$DYLIB"
          ldid -S "$DYLIB"
          cp "$DYLIB" ../dist/BXFloatInject.dylib
          ls -lh ../dist

      - name: Upload MVP IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatMVP-ipa
          path: dist/BXFloatMVP.ipa

      - name: Upload Host IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatHost-ipa
          path: dist/BXFloatHost.ipa

      - name: Upload Inject dylib
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatInject-dylib
          path: dist/BXFloatInject.dylib
