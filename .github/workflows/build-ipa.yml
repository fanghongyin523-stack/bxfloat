name: Build IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "BXFloatMVP/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: BXFloatMVP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup CocoaPods
        run: |
          gem install cocoapods -N
          pod install --repo-update

      - name: Build App + Inject (with VLC) + Host
        run: |
          set -euo pipefail
          for scheme in BXFloatMVP BXFloatInject; do
            xcodebuild \
              -workspace BXFloatMVP.xcworkspace \
              -scheme "$scheme" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
          done

          xcodebuild \
            -project BXFloatMVP.xcodeproj \
            -scheme BXFloatHost \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Install ldid
        run: brew install ldid

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p ../dist

          sign_tree () {
            local root="$1"
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q 'Mach-O'; then
                ldid -S "$f" || true
              fi
            done < <(find "$root" -type f -print0)
          }

          package_ipa () {
            local app_path="$1"
            local out_ipa="$2"
            test -d "$app_path"
            sign_tree "$app_path"
            rm -rf Payload
            mkdir Payload
            cp -R "$app_path" Payload/
            zip -qr "$out_ipa" Payload
            cp "$out_ipa" ../dist/
          }

          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatMVP.app" \
            "BXFloatMVP.ipa"

          package_ipa \
            "build/Build/Products/Release-iphoneos/BXFloatHost.app" \
            "BXFloatHost.ipa"

          DYLIB="build/Build/Products/Release-iphoneos/BXFloatInject.dylib"
          test -f "$DYLIB"
          ldid -S "$DYLIB" || true
          install_name_tool -add_rpath "@executable_path/Frameworks" "$DYLIB" 2>/dev/null || true
          install_name_tool -add_rpath "@loader_path/Frameworks" "$DYLIB" 2>/dev/null || true

          rm -rf ../dist/BXFloatInjectPack
          mkdir -p ../dist/BXFloatInjectPack/Frameworks
          cp "$DYLIB" ../dist/BXFloatInjectPack/BXFloatInject.dylib
          cp "$DYLIB" ../dist/BXFloatInject.dylib

          FW=$(find build Pods -type d -name 'MobileVLCKit.framework' 2>/dev/null | head -n 1 || true)
          if [ -z "$FW" ] || [ ! -d "$FW" ]; then
            echo "MobileVLCKit.framework not found"
            find build -iname '*VLC*' | head -n 80 || true
            exit 1
          fi
          echo "Using VLC framework: $FW"
          cp -R "$FW" ../dist/BXFloatInjectPack/Frameworks/
          sign_tree ../dist/BXFloatInjectPack

          cat > ../dist/BXFloatInjectPack/README.txt << 'EOF'
BXFloat Inject Pack (LAN RTSP low latency)

Files:
1) BXFloatInject.dylib
2) Frameworks/MobileVLCKit.framework

Install (Douyin etc):
A. TrollFools inject BXFloatInject.dylib
B. Filza: copy MobileVLCKit.framework into XXX.app/Frameworks/
   (create Frameworks folder if missing)
C. Force-quit app, reopen, overlay -> LAN -> computer IP

Notes:
- BXFloatMVP.ipa already embeds VLC (no extra framework)
- Inject MUST include MobileVLCKit for RTSP
EOF

          ( cd ../dist/BXFloatInjectPack && zip -qr ../BXFloatInjectPack.zip . )
          ls -lh ../dist

      - name: Upload MVP IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatMVP-ipa
          path: dist/BXFloatMVP.ipa

      - name: Upload Host IPA
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatHost-ipa
          path: dist/BXFloatHost.ipa

      - name: Upload Inject dylib
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatInject-dylib
          path: dist/BXFloatInject.dylib

      - name: Upload Inject Pack
        uses: actions/upload-artifact@v4
        with:
          name: BXFloatInjectPack
          path: dist/BXFloatInjectPack.zip
